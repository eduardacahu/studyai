<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyAI</title>

    <style>
        body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#2563eb,#0f172a);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:750px;
    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:0 20px 45px rgba(0,0,0,.25);

}

h1{

    text-align:center;

    color:#2563eb;

    margin-bottom:5px;

}

p{

    text-align:center;

    color:#555;

}

input{

    width:100%;

    padding:14px;

    border-radius:10px;

    border:1px solid #ddd;

    font-size:16px;

    margin-top:20px;

    box-sizing:border-box;

}

input:focus{

    outline:none;

    border:1px solid #2563eb;

}

button{

    width:100%;

    margin-top:18px;

    padding:14px;

    background:#2563eb;

    color:white;

    font-size:17px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#1d4ed8;

    transform:translateY(-2px);

}

#resposta{

    margin-top:30px;

    background:#f8fafc;

    border-left:5px solid #2563eb;

    padding:20px;

    border-radius:10px;

    white-space:pre-wrap;

    line-height:1.7;

    min-height:150px;

}
    </style>

</head>
<body>

<div class="container">

    <h1>🧠 StudyAI</h1>

    <p>
        Seu assistente inteligente para estudos
    </p>

    <input
        id="pergunta"
        type="text"
        placeholder="Digite sua pergunta..."
    >

    <button onclick="perguntar()">
        🚀 Perguntar
    </button>

    <div id="resposta">

        Faça uma pergunta para começar.

    </div>

    <hr>

    <small>

        Powered by
        <strong>Gemini</strong> •
        Spring Boot •
        DevOps

    </small>

</div>
<script>

const campo = document.getElementById("pergunta");

campo.addEventListener("keydown", function(event){

    if(event.key === "Enter"){
        perguntar();
    }

});

async function perguntar(){

    const pergunta = campo.value.trim();

    if(pergunta === ""){

        alert("Digite uma pergunta.");

        return;

    }

    const respostaDiv = document.getElementById("resposta");

    respostaDiv.innerHTML = "🤖 Pensando...";

    try{

        const resposta = await fetch(
            "/perguntar?pergunta=" + encodeURIComponent(pergunta)
        );

        const texto = await resposta.text();

        respostaDiv.innerText = texto;

    }catch(e){

        respostaDiv.innerHTML =
        "❌ Não foi possível conectar à IA.";

    }

}

</script>

</body>
</html>
